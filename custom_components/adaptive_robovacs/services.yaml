evaluate:
  name: Evaluate schedule
  description: Builds the current schedule and, unless dry run is selected, dispatches eligible work when observe-only and Party Mode are off.
  fields:
    dry_run:
      name: Dry run
      description: Build a non-dispatching schedule preview.
      selector:
        boolean:
    entry_id:
      name: Config entry
      description: Required only when more than one Adaptive RoboVacs entry is loaded.
      selector:
        config_entry:
          integration: adaptive_robovacs
record_manual_clean:
  name: Record manual clean
  description: Defers known area work due in the next 24 hours by one day.
  fields:
    robot_entity_id:
      required: true
      selector:
        entity:
          domain: vacuum
    area_ids:
      required: true
      selector:
        area:
          multiple: true
    operations:
      selector:
        select:
          multiple: true
          options:
            - vacuum
            - mop
    entry_id:
      name: Config entry
      description: Required only when more than one Adaptive RoboVacs entry is loaded.
      selector:
        config_entry:
          integration: adaptive_robovacs
list_legacy_deferrals:
  name: List legacy deferrals
  description: Lists migrated timestamp-only room deferrals for review. This service never starts a clean or changes scheduler state.
  fields:
    entry_id:
      name: Config entry
      description: Required only when more than one Adaptive RoboVacs entry is loaded.
      selector:
        config_entry:
          integration: adaptive_robovacs
clear_legacy_deferrals:
  name: Clear reviewed legacy deferrals
  description: Removes only the selected migrated timestamp-only deferrals. It never starts a clean; the next normal scheduler evaluation applies the room's natural cadence.
  fields:
    area_ids:
      name: Rooms
      required: true
      selector:
        area:
          multiple: true
    confirm:
      name: Confirm removal
      description: Required acknowledgement that only reviewed legacy deferrals for these rooms will be removed.
      required: true
      selector:
        boolean:
    entry_id:
      name: Config entry
      description: Required only when more than one Adaptive RoboVacs entry is loaded.
      selector:
        config_entry:
          integration: adaptive_robovacs
manual_clean_room:
  name: Manually clean room
  description: Immediately starts an explicit user override for one discovered room. It bypasses cadence, vacancy/occupancy, desired-window, configured enablement, battery, scheduler-hold, and scheduler-halt gates. A compatible same-floor robot must be physically docked. Party Mode and observe-only mode remain non-bypassable.
  fields:
    area_id:
      name: Room
      required: true
      selector:
        area:
    mode:
      name: Cleaning mode
      required: true
      default: configured
      selector:
        select:
          options:
            - label: Current settings
              value: configured
            - label: Vacuum only
              value: vacuum_only
            - label: Mop only
              value: mop_only
    entry_id:
      name: Config entry
      description: Required only when more than one Adaptive RoboVacs entry is loaded.
      selector:
        config_entry:
          integration: adaptive_robovacs
list_retained_maps:
  name: List retained maps
  description: Lists the maps the selected robot currently retains. This reads the existing Roborock Home Assistant connection and never moves the robot.
  fields:
    robot_entity_id:
      name: Robot
      required: true
      selector:
        entity:
          domain: vacuum
    entry_id:
      name: Config entry
      description: Required only when more than one Adaptive RoboVacs entry is loaded.
      selector:
        config_entry:
          integration: adaptive_robovacs
capture_map_snapshot:
  name: Capture map snapshot
  description: Requests map data while the robot is docked or idle and stores the returned snapshot on the Home Assistant server. It does not copy, export, or restore robot maps.
  fields:
    robot_entity_id:
      name: Robot
      required: true
      selector:
        entity:
          domain: vacuum
    entry_id:
      name: Config entry
      description: Required only when more than one Adaptive RoboVacs entry is loaded.
      selector:
        config_entry:
          integration: adaptive_robovacs
activate_retained_map:
  name: Activate retained map
  description: Selects a map that the robot still retains. It does not start a clean and scheduler dispatch remains held until the map selection is confirmed.
  fields:
    robot_entity_id:
      name: Robot
      required: true
      selector:
        entity:
          domain: vacuum
    map_id:
      name: Retained map ID
      required: true
      selector:
        text:
    confirm:
      name: Confirm map activation
      description: Required acknowledgement that this changes the active robot-held map but does not move the robot.
      required: true
      selector:
        boolean:
    entry_id:
      name: Config entry
      description: Required only when more than one Adaptive RoboVacs entry is loaded.
      selector:
        config_entry:
          integration: adaptive_robovacs
confirm_map_selection:
  name: Confirm map selection and resume scheduling
  description: Releases the manual map-selection scheduler hold after the robot has been relocalized and Home Assistant mapping has been rechecked.
  fields:
    robot_entity_id:
      name: Robot
      required: true
      selector:
        entity:
          domain: vacuum
    confirm:
      name: Confirm verification
      required: true
      selector:
        boolean:
    entry_id:
      name: Config entry
      description: Required only when more than one Adaptive RoboVacs entry is loaded.
      selector:
        config_entry:
          integration: adaptive_robovacs
