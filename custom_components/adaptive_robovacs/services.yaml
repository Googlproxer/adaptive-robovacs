evaluate:
  name: Evaluate schedule
  description: Builds the current schedule and, unless dry run is selected, dispatches eligible work when observe-only and Party Mode are off.
  fields:
    dry_run:
      name: Dry run
      description: Build a non-dispatching schedule preview.
      selector:
        boolean:
    entry_id:
      name: Config entry
      description: Required only when more than one Adaptive RoboVacs entry is loaded.
      selector:
        config_entry:
          integration: adaptive_robovacs
record_manual_clean:
  name: Record manual clean
  description: Defers known area work due in the next 24 hours by one day.
  fields:
    robot_entity_id:
      required: true
      selector:
        entity:
          domain: vacuum
    area_ids:
      required: true
      selector:
        area:
          multiple: true
    operations:
      selector:
        select:
          multiple: true
          options:
            - vacuum
            - mop
    entry_id:
      name: Config entry
      description: Required only when more than one Adaptive RoboVacs entry is loaded.
      selector:
        config_entry:
          integration: adaptive_robovacs
list_legacy_deferrals:
  name: List legacy deferrals
  description: Lists migrated timestamp-only room deferrals for review. This service never starts a clean or changes scheduler state.
  fields:
    entry_id:
      name: Config entry
      description: Required only when more than one Adaptive RoboVacs entry is loaded.
      selector:
        config_entry:
          integration: adaptive_robovacs
clear_legacy_deferrals:
  name: Clear reviewed legacy deferrals
  description: Removes only the selected migrated timestamp-only deferrals. It never starts a clean; the next normal scheduler evaluation applies the room's natural cadence.
  fields:
    area_ids:
      name: Rooms
      required: true
      selector:
        area:
          multiple: true
    confirm:
      name: Confirm removal
      description: Required acknowledgement that only reviewed legacy deferrals for these rooms will be removed.
      required: true
      selector:
        boolean:
    entry_id:
      name: Config entry
      description: Required only when more than one Adaptive RoboVacs entry is loaded.
      selector:
        config_entry:
          integration: adaptive_robovacs
manual_clean_room:
  name: Manually clean room
  description: Immediately starts an explicit user override for one discovered room. It bypasses cadence, vacancy/occupancy, desired-window, configured enablement, battery, scheduler-hold, and scheduler-halt gates. A compatible same-floor robot must be physically docked. Party Mode and observe-only mode remain non-bypassable.
  fields:
    area_id:
      name: Room
      required: true
      selector:
        area:
    mode:
      name: Cleaning mode
      required: true
      default: configured
      selector:
        select:
          options:
            - label: Current settings
              value: configured
            - label: Vacuum only
              value: vacuum_only
            - label: Mop only
              value: mop_only
    entry_id:
      name: Config entry
      description: Required only when more than one Adaptive RoboVacs entry is loaded.
      selector:
        config_entry:
          integration: adaptive_robovacs
save_floor_plan:
  name: Save floor plan
  description: Administrator-only atomic save of one floor-plan draft. Links affect adjacency protection for subsequent scheduled stages. Saving refreshes the preview without starting or stopping cleaning.
  fields:
    floor_id:
      name: Floor
      required: true
      selector:
        text:
    revision:
      name: Revision
      required: true
      selector:
        number:
          min: 0
          mode: box
    rooms:
      name: Room rectangles
      description: Mapping of discovered same-floor area IDs to snap-grid x, y, width, and height values.
      required: true
      selector:
        object:
    edges:
      name: Room links
      description: Direct two-area links for the selected floor.
      required: true
      selector:
        object:
    sensors:
      name: Sensor markers
      description: Mapping of occupancy-source registry IDs to their room-local x/y marker positions.
      required: true
      selector:
        object:
    forget_area_ids:
      name: Forget unavailable rooms
      selector:
        area:
          multiple: true
    forget_sensor_registry_ids:
      name: Forget unavailable sensors
      selector:
        text:
          multiple: true
    entry_id:
      name: Config entry
      description: Required only when more than one Adaptive RoboVacs entry is loaded.
      selector:
        config_entry:
          integration: adaptive_robovacs
set_room_adjacency:
  name: Set room adjacency
  description: Administrator-only replacement of one discovered room's direct same-floor neighbours. Links affect adjacency protection for subsequent scheduled stages. Saving refreshes the preview without starting or stopping cleaning.
  fields:
    area_id:
      name: Room
      required: true
      selector:
        area:
    neighbor_area_ids:
      name: Adjacent rooms
      selector:
        area:
          multiple: true
    entry_id:
      name: Config entry
      description: Required only when more than one Adaptive RoboVacs entry is loaded.
      selector:
        config_entry:
          integration: adaptive_robovacs
