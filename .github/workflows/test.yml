name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.10"
          cache: pip
      - name: Install pinned test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_test.txt
      - name: Verify toolchain pins
        run: |
          python --version
          python -m pip show homeassistant
          pytest --version
          ruff --version
          mypy --version
      - name: Ruff format
        run: ruff format --check custom_components tests
      - name: Ruff lint
        run: ruff check custom_components tests
      - name: Strict typing
        run: mypy custom_components/adaptive_robovacs
      - name: Pytest and coverage
        run: >-
          python -m pytest
          --cov=custom_components.adaptive_robovacs
          --cov-report=term-missing
          --cov-fail-under=95
      - name: Dashboard tests
        run: node --test tests/test_dashboard.mjs
      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
      - name: Floorplan browser regressions
        run: npm run test:browser
      - name: Unittest compatibility
        run: python -m unittest discover -s tests -v
      - name: Compile production modules
        run: python -m compileall -q custom_components/adaptive_robovacs
      - name: Verify shipped file parity
        run: |
          cmp \
            custom_components/adaptive_robovacs/frontend/adaptive-robovacs-dashboard.js \
            dashboard/adaptive-robovacs-dashboard.js
          cmp \
            custom_components/adaptive_robovacs/brand/icon.png \
            icon.png
