name: Test

on:
  push:
  pull_request:

jobs:
  scheduler-decisions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile custom_components/adaptive_robovacs/*.py
