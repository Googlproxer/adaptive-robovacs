name: Performance benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - custom_components/**
      - benchmarks/**
      - requirements_test.txt
      - requirements_benchmark.txt
      - .github/workflows/performance.yml
  pull_request:
    paths:
      - custom_components/**
      - benchmarks/**
      - requirements_test.txt
      - requirements_benchmark.txt
      - .github/workflows/performance.yml

permissions:
  contents: read

concurrency:
  group: performance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.9"
          cache: pip
      - name: Install the existing pinned test environment and browser tooling
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          pins = [line for line in Path("requirements_test.txt").read_text().splitlines()
                  if line.strip() and not line.startswith("#")]
          pytest_pin = next(pin for pin in pins if pin.startswith("pytest=="))
          subprocess.check_call([sys.executable, "-m", "pip", "install",
                                 *[pin for pin in pins if pin != pytest_pin]])
          subprocess.check_call([sys.executable, "-m", "pip", "install", "--no-deps", pytest_pin])
          PY
          python -m pip install -r requirements_benchmark.txt
          python -m playwright install --with-deps chromium
      - name: Check benchmark tooling
        run: |
          python -m ruff format --check benchmarks tests/test_benchmark_reporting.py
          python -m ruff check benchmarks tests/test_benchmark_reporting.py
          python -m unittest discover -s tests -p test_benchmark_reporting.py -v
      # Timing budgets are advisory on shared runners. Behavioural invariants
      # still fail the run. Use --check only for a controlled performance runner.
      - name: Backend timings, allocations, event-loop delay and CPU profiles
        run: >-
          python -u -m benchmarks --samples 25 --warmup 5
          --output test-results/performance/backend.json
          --profile test-results/performance/profiles
      - name: Real Chromium dashboard timings
        run: >-
          python -u -m benchmarks.dashboard --samples 50 --warmup 5
          --output test-results/performance/dashboard.json
      - name: Retain benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-${{ github.sha }}
          path: test-results/performance/
          if-no-files-found: warn
          retention-days: 30
